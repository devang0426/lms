# CI (feature 23): lint, unit tests, build, and the client-bundle secret
# check on every push and pull request, or by hand (Actions → CI → Run
# workflow). The Playwright suite in e2e/ isn't run in CI; run it locally
# when wanted (e2e/README.md).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY, CLERK_SECRET_KEY, DATABASE_URL,
#   DATABASE_URL_POOLED, BLOB_READ_WRITE_TOKEN, TRIGGER_SECRET_KEY,
#   OPENROUTER_API_KEY. The build reads the Clerk keys; the others are
#   there so the secret check looks for their real values.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DEMO_MODE: "false"
      # The public pages are built statically (feature 34) and need these.
      # The landing page's course list reads DATABASE_URL at build time.
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      INSTITUTE_NAME: "CI build"
      INSTITUTE_EMAIL: "office@example.edu"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      TRIGGER_SECRET_KEY: ${{ secrets.TRIGGER_SECRET_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:secrets
